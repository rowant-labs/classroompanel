    <radialGradient id="board" cx="46%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#1d3326"/>
      <stop offset="100%" stop-color="#0f1d15"/>
    </radialGradient>
  </defs>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="url(#board)" stroke="#3a5844" stroke-width="3"/>
  <path d="M12 47 C 25 45, 33 37, 50 17" fill="none" stroke="#fff8df" stroke-width="7" stroke-linecap="round"/>
  <circle cx="37" cy="32" r="6.5" fill="#f0d98d"/>
</svg>
